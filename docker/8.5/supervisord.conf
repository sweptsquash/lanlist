[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=php-fpm8.5 -F
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
startretries=0

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
startretries=0

[program:queue]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan horizon
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
numprocs=1
startsecs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stopwaitsecs=5
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true

[program:reverb]
command=%(ENV_SUPERVISOR_REVERB_COMMAND)s
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
numprocs=1
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=5
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true

[program:clamd]
command=/usr/sbin/clamd -c /etc/clamav/clamd.conf
autostart=true
autorestart=true
priority=30
user=clamav
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stderr_logfile=/var/log/supervisor/%(program_name)s.log


[program:freshclam]
command=/usr/bin/freshclam -d --quiet -c %(ENV_FRESHCLAM_UPDATE)s --config-file=/etc/clamav/freshclam.conf
autostart=true
autorestart=true
priority=20
startretries=1
user=clamav
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stderr_logfile=/var/log/supervisor/%(program_name)s.log
