name: Check Frontend Linting & Styling

permissions:
  contents: read

on:
  push:
    branches:
      - master
    paths:
      - "resources/css/**/*"
      - "resources/js/**/*"
      - "package-lock.json"
      - ".github/workflows/frontend-lint.yml"
  pull_request:
    branches:
      - master
    paths:
      - "resources/css/**/*"
      - "resources/js/**/*"
      - "package-lock.json"
      - ".github/workflows/frontend-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: ./.github/actions/setup-node

      - name: Build Packages
        run: |
          npm --prefix=packages/vite-plugin-watch ci
          npm --prefix=packages/lararail ci
          npm run prepare

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run test:lint
