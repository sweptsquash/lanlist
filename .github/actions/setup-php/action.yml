name: Setup PHP
description: Setup PHP for testing
inputs:
  php-version:
    description: 'PHP version to setup'
    required: false
    default: '8.5'
runs:
  using: 'composite'
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: dom, curl, libxml, bcmath, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, redis-phpredis/phpredis@6.1.0, igbinary, msgpack, zstd, lz4, memcached, gmp, mcrypt
        ini-values: log_errors=On, error_reporting=E_ALL, error_log=~/phpunit/php_errors.log, date.timezone=UTC, memory_limit=-1, max_execution_time=-1, display_errors=On, display_startup_errors=On
        tools: composer:v2
        coverage: pcov
      env:
        REDIS_CONFIGURE_OPTS: --enable-redis --enable-redis-igbinary --enable-redis-msgpack --enable-redis-lzf --with-liblzf --enable-redis-zstd --with-libzstd --enable-redis-lz4 --with-liblz4
        REDIS_LIBS: liblz4-dev, liblzf-dev, libzstd-dev
